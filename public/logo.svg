<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ring (Broken for dynamism) -->
  <path d="M50 15C30.67 15 15 30.67 15 50C15 69.33 30.67 85 50 85C69.33 85 85 69.33 85 50" 
        stroke="url(#logo-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Abstract 'G' / Hook / Chart -->
  <path d="M50 35V65M35 50H65M65 50L75 40M65 50L75 60" 
        stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Diamond -->
  <rect x="45" y="45" width="10" height="10" transform="rotate(45 50 50)" fill="#10b981" />
  
  <!-- Precision Dots -->
  <circle cx="50" cy="15" r="2" fill="white" />
  <circle cx="85" cy="50" r="2" fill="white" />
  <circle cx="50" cy="85" r="2" fill="white" />
  <circle cx="15" cy="50" r="2" fill="white" />
</svg>
